[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photopipe"
version = "0.1.0"
description = "Photo scanning metadata pipeline for Epson FastFoto workflow"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "PhotoPipe"}
]
keywords = ["photo", "scanner", "metadata", "ocr", "exif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "streamlit>=1.30.0",
    "pyexiftool>=0.5.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "anthropic>=0.18.0",
    "geopy>=2.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "watchdog>=3.0.0",
    "python-dateutil>=2.8.0",
    "PyYAML>=6.0.0",
    # "python-sane>=2.9.0",  # Optional: requires SANE dev headers
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black",
    "ruff",
]

[project.scripts]
photopipe = "photopipe.__main__:main"

[project.urls]
Homepage = "https://github.com/user/photopipe"

[tool.setuptools.packages.find]
where = ["."]
include = ["photopipe*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
